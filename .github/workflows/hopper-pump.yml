name: hopper-pump

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  pump:
    runs-on: ubuntu-latest
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
      - name: pump if hopper has ETH
        env:
          RPC: ${{ vars.HOPPER_RPC || 'https://rpc.mainnet.chain.robinhood.com' }}
          HOPPER: ${{ vars.HOPPER }}
          PRIVATE_KEY: ${{ secrets.HOPPER_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOPPER:-}" ]; then
            echo "Set repo variable HOPPER to the hopper CA"
            exit 0
          fi
          BAL=$(cast balance "$HOPPER" --rpc-url "$RPC")
          echo "hopper wei=$BAL"
          if [ "$BAL" -lt 10000000000000 ]; then
            echo "below dust — skip"
            exit 0
          fi
          if [ -z "${PRIVATE_KEY:-}" ]; then
            echo "Add repo secret HOPPER_KEY (keeper private key, 0x…)"
            exit 1
          fi
          # no token buys until setStinks — pump() is a no-op then
          cast send "$HOPPER" "pump()" --rpc-url "$RPC" --private-key "$PRIVATE_KEY" --legacy
