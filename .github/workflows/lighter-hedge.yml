name: lighter-hedge

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  hedge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: pip install lighter-sdk
      - name: hedge
        env:
          LIGHTER_API_PRIVATE_KEY: ${{ secrets.LIGHTER_API_PRIVATE_KEY }}
          LIGHTER_ACCOUNT_INDEX: "25861"
          LIGHTER_API_KEY_INDEX: "4"
          PRIVATE_KEY: ${{ secrets.HEDGE_KEY }}
        run: python script/lighter_keeper.py
